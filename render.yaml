# NOT IN EFFECT. The live service is configured in the Render dashboard, and it
# disagrees with this file in three places: dashboard rootDir is `backend` where
# this says `.`, the build command is `npm install && npx medusa build` where
# this says `npm run build:backend`, and the health check path is EMPTY where
# this says /health. Checked against Render's API on 3 November 2026.
#
# So do not read the list below as what is set, and above all do not read
# `healthCheckPath: /health` as meaning a health check is configured - there
# was none for the week the service served stale code, which is exactly how
# that went unnoticed. Change either of those in the dashboard, or apply this
# file as a Blueprint deliberately and accept that it also resets rootDir and
# the build command.
#
# `sync: false` means the value lives in the dashboard and is not in this repo.
services:
  - type: web
    name: medusa-backend
    env: node
    rootDir: .
    plan: starter
    buildCommand: |
      npm install
      npm run build:backend
    startCommand: npm --workspace backend run start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: COOKIE_SECRET
        sync: false
      - key: STORE_CORS
        value: https://777records777.studio
      - key: ADMIN_CORS
        value: https://777records777.studio/admin,http://localhost:9000/app
      - key: MEDUSA_BACKEND_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: PREORDER_FROM_EMAIL
        sync: false
      - key: PREORDER_REPLY_TO
        sync: false
      - key: OM7_SITE_MANAGER_TOKEN_SHA256
        sync: false
      - key: OM7_SITE_MANAGER_RECEIPT_SECRET
        sync: false
      - key: OM7_SITE_MANAGER_S3_BUCKET
        value: 777records777productpageassets
      - key: OM7_SITE_MANAGER_S3_REGION
        value: us-east-2
      - key: OM7_SITE_MANAGER_PUBLIC_BASE_URL
        sync: false
      - key: OM7_SITE_MANAGER_KEY_PREFIX
        value: site-manager
      - key: OM7_SITE_MANAGER_MAX_BYTES
        value: "5368709120"
      - key: OM7_SITE_MANAGER_UPLOAD_TTL_SECONDS
        value: "900"
      - key: OM7_SITE_MANAGER_RECEIPT_TTL_SECONDS
        value: "86400"
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
